name: Build APK

# Two APK variants (same package name and signature, so one can be installed over the other):
#   standard : OPUS-MT + OPUS-MT lite + M2M100 (~1.0 GB)
#   full     : standard + NLLB-200 (~1.7 GB)
# - every push to main            : builds the standard APK and uploads it as a workflow artifact
# - manual run with "full" ticked : also builds the full APK
# - pushing a tag like v1.0.0     : builds both and publishes them as a GitHub Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build the full APK with NLLB-200 (slow)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.full) && '["standard","full"]' || '["standard"]') }}

    steps:
      # Converting the large multilingual models needs several GB of scratch space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships with an Android SDK ($ANDROID_HOME); just make sure the packages we need exist.
      - name: Install Android SDK packages
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # The converted models are cached; they only change when the conversion scripts do.
      # OPUS-MT + OPUS-MT lite + M2M100 go into every APK; NLLB-200 is only in the full one.
      - name: Restore converted models (OPUS-MT)
        id: cache-opus
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/opus-mt
            app/src/main/assets/models/opus-lite
          key: models-opus-v3-${{ hashFiles('tools/prepare_models.py', 'tools/lite_vocab.py', 'tools/requirements.txt') }}

      - name: Restore converted model (M2M100)
        id: cache-m2m
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/m2m100
          key: models-m2m-v4-${{ hashFiles('tools/prepare_models.py', 'tools/requirements.txt') }}

      - name: Restore converted model (NLLB-200)
        id: cache-nllb
        if: matrix.variant == 'full'
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/nllb
          key: models-nllb-v4-${{ hashFiles('tools/prepare_models.py', 'tools/requirements.txt') }}

      - name: Install conversion tools
        if: steps.cache-opus.outputs.cache-hit != 'true' || steps.cache-m2m.outputs.cache-hit != 'true' || (matrix.variant == 'full' && steps.cache-nllb.outputs.cache-hit != 'true')
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/requirements.txt

      - name: Convert OPUS-MT models (ONNX export + int8 quantization + vocabulary pruning)
        if: steps.cache-opus.outputs.cache-hit != 'true'
        run: |
          python tools/prepare_models.py --out app/src/main/assets --work "$RUNNER_TEMP/model-work" --only opus-mt --smoke
          python tools/prepare_models.py --out app/src/main/assets --work "$RUNNER_TEMP/model-work" --only opus-lite --smoke

      - name: Convert M2M100
        if: steps.cache-m2m.outputs.cache-hit != 'true'
        run: |
          python tools/prepare_models.py --out app/src/main/assets --work "$RUNNER_TEMP/model-work" --only m2m100 --smoke

      - name: Convert NLLB-200
        if: matrix.variant == 'full' && steps.cache-nllb.outputs.cache-hit != 'true'
        run: |
          python tools/prepare_models.py --out app/src/main/assets --work "$RUNNER_TEMP/model-work" --only nllb --smoke

      - name: Check model files
        run: |
          ls -lhR app/src/main/assets/models | head -80
          MODELS="opus-mt opus-lite m2m100"
          if [ "${{ matrix.variant }}" = "full" ]; then MODELS="$MODELS nllb"; fi
          for m in $MODELS; do test -f app/src/main/assets/models/$m/VERSION; done
          du -sh app/src/main/assets/models/*

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [ "${{ matrix.variant }}" = "full" ]; then SUFFIX="-full"; else SUFFIX=""; fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V (code $GITHUB_RUN_NUMBER)"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="$SECRET_KEYSTORE_PASSWORD"
            ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASSWORD"
          else
            echo "::warning::No signing secrets configured - using a temporary key. APKs signed with different keys cannot be installed over each other."
            STORE_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$STORE_PASS"
            ALIAS="release"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore "$KS" -storepass "$STORE_PASS" -alias "$ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Japanese Chinese Translator, O=JHCWColin"
          fi
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Verify signature and name the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          OUT="JapaneseChineseTranslator-v${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseChineseTranslator-apk-${{ matrix.variant }}
          path: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: JapaneseChineseTranslator-apk-*
          merge-multiple: true
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 日中互译 ${{ github.ref_name }}
          files: release-files/*
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
