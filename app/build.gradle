plugins {
    id 'com.android.application'
}

// Release signing is configured through environment variables (set by the GitHub workflow).
def releaseKeystore = System.getenv('KEYSTORE_FILE')

// Version comes from the workflow: -PappVersionName=1.4.0 -PappVersionCode=...
def appVersionName = (project.findProperty('appVersionName') ?: '1.4.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.jhcwcolin.jctranslator'
    // -PcompileSdkVersion=35 lets a machine that only has a newer platform installed build locally.
    // Keep the value in a local variable: the AGP Groovy DSL treats a parenthesised
    // expression after compileSdk as a closure in some Gradle 8.x versions and reports
    // the rather misleading "Value is null" error.
    def compileSdkValue = (project.findProperty('compileSdkVersion') ?: '34').toString().toInteger()
    compileSdk compileSdkValue

    defaultConfig {
        applicationId 'com.jhcwcolin.jctranslator'
        minSdk 26          // Android 8.0+ (target device: Android 8.1)
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        // 32-bit and 64-bit ARM e-ink devices.  No x86 to keep the APK small.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false      // JNI code in onnxruntime looks up Java classes by name
            shrinkResources false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // Model files are incompressible int8 weights: store them as-is (faster build, faster first run).
    androidResources {
        noCompress 'onnx', 'onnx_data', 'spm', 'txt', 'properties'
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
