plugins {
    id 'com.android.application'
}

// Release signing is configured through environment variables (set by the GitHub workflow).
def releaseKeystore = System.getenv('KEYSTORE_FILE')

// Version comes from the workflow: -PappVersionName=1.0.0 -PappVersionCode=12
def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.jhcwcolin.jctranslator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jhcwcolin.jctranslator'
        minSdk 26          // Android 8.0+ (target device: Android 8.1)
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        // 32-bit and 64-bit ARM e-ink devices.  No x86 to keep the APK small.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false      // JNI code in onnxruntime looks up Java classes by name
            shrinkResources false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
